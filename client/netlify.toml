[build]
  command = "npm run build"
  publish = "dist"

# ── Netlify API proxy redirect to live Render backend ──
[[redirects]]
  from = "/api/*"
  to = "https://veterinary-care-predictive-operations.onrender.com/api/:splat"
  status = 200
  force = true

# ── SPA fallback: always serve index.html for client-side routing ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
