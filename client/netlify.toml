[build]
  command = "npm run build"
  publish = "dist"

# ── Replace the URL below with your actual Render backend URL after deploying ──
[[redirects]]
  from = "/api/*"
  to = "https://your-render-backend-url.onrender.com/api/:splat"
  status = 200
  force = true

# ── SPA fallback: always serve index.html for client-side routing ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
